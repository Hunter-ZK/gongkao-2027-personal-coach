name: Workbench CI

on:
  push:
    branches:
      - main
      - rebuild/workbench-v1
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: local_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Import legacy notes and seed clean database
        run: |
          python tools/import_legacy.py
          python tools/seed.py
      - name: Python tests
        run: python -m pytest -q -rs
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check frontend syntax
        run: |
          node --check static/js/app.js
          node --check static/js/runtime.js
          node --check static/js/pages/dashboard.js
          node --check static/js/pages/learning.js
          node --check static/js/pages/knowledge.js
          node --check static/js/lib/charts.js
      - name: Content lint
        run: python tools/content_lint.py content/nodes --cross-check
