name: Workbench CI

on:
  push:
    branches:
      - main
      - rebuild/workbench-v1
      - feature/workbench-v3-gemini-analytics-ai
      - feature/civil-gemini2-exact-frontend
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: local_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Install and build Civil Gemini React frontend
        run: |
          cd frontend
          npm install
          npm run lint
          npm run build
      - name: Build formal knowledge coverage and seed clean database
        run: |
          python tools/generate_missing_nodes.py
          python tools/import_legacy.py
          python tools/seed.py
      - name: Python tests
        run: python -m pytest -q -rs
      - name: Compile Python
        run: python -m compileall -q .
      - name: Strict legacy frontend syntax check
        run: python tools/check_frontend.py
      - name: Legacy frontend boot smoke
        run: node tests/frontend_boot_smoke.mjs
      - name: Visual system lint
        run: python tools/css_lint.py static/css templates static/js
      - name: Content lint
        run: python tools/content_lint.py content/nodes --cross-check
